<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>타임슬립 한국사</title>
<meta name="description" content="선사부터 현대까지 36개 이야기. 역사 속 인물과 대화하며 한능검 심화를 익히는 모바일 게임, 타임슬립 한국사.">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Hahmlet:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* 게임 화면과 같은 먹빛 바탕·금빛 글씨. 밝은 화면에서도 같은 세계를 유지한다(단일 테마). */
  :root{ --bg:#140f0a; --card:#21180f; --line:#4a3a24; --gold:#f0c96b; --gold2:#c9a24a; --txt:#f5ecd8; --dim:#c9bca2; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--txt); font-family:"Gowun Batang",serif; line-height:1.75; }
  .wrap{ max-width:560px; margin:0 auto; padding:56px 20px 48px; text-align:center; }
  .icon{ width:112px; height:112px; border-radius:26px; border:1px solid var(--line); box-shadow:0 10px 30px rgba(0,0,0,.5); }
  h1{ font-family:"Hahmlet",serif; font-weight:800; font-size:2rem; margin:22px 0 4px; color:var(--gold); letter-spacing:.02em; }
  .sub{ color:var(--dim); margin:0 0 26px; font-size:1rem; }
  .lead{ text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin:0 0 26px; font-size:.97rem; }
  .lead p{ margin:0 0 8px; } .lead p:last-child{ margin:0; }
  .stores{ display:flex; flex-direction:column; gap:10px; margin:0 0 30px; }
  .btn{ display:block; padding:14px 18px; border-radius:12px; font-family:"Hahmlet",serif; font-weight:700; font-size:1.02rem; text-decoration:none; }
  .btn.main{ background:var(--gold2); color:#1b1209; }
  .btn.main:hover, .btn.main:focus-visible{ background:var(--gold); outline:none; }
  .btn.soon{ border:1px dashed var(--line); color:var(--dim); cursor:default; }
  nav{ display:flex; justify-content:center; gap:22px; font-size:.92rem; }
  nav a{ color:var(--gold); text-decoration:none; } nav a:hover, nav a:focus-visible{ text-decoration:underline; outline:none; }
  footer{ margin-top:34px; color:#8a7c64; font-size:.8rem; }
</style>
</head>
<body>
  <main class="wrap">
    <img class="icon" src="icon.png" alt="타임슬립 한국사 아이콘" width="112" height="112">
    <h1>타임슬립 한국사</h1>
    <p class="sub">한능검 심화 기출, 이야기로 끝내기</p>
    <div class="lead">
      <p>독서실에서 졸다 눈을 뜨니 선사 시대. 차돌이·바우와 함께 선사부터 현대까지 36개 이야기를 건너며, 역사 속 인물과 직접 대화합니다.</p>
      <p>대화 속 지도와 도해로 흐름을 잡고, 한능검 기출로 보스를 논파하세요. 로그인 없이 바로 시작할 수 있습니다.</p>
    </div>
    <div class="stores">
      <a class="btn main" href="https://apps.apple.com/kr/app/id6813351584">App Store에서 받기</a>
      <span class="btn soon">Google Play · 출시 준비 중</span>
    </div>
    <nav>
      <a href="support.html">지원·문의</a>
      <a href="privacy.html">개인정보처리방침</a>
    </nav>
    <footer>© 2026 SEONGIL YUN · tjddlf0224@gmail.com</footer>
  </main>
</body>
</html>
