# 블로그 글이 새로 공개되거나 바뀌면 네이버·빙에 IndexNow 로 바로 알린다(2026-10-05).
# 열쇠 파일: 사이트 루트 8fb884de5309075b854d7495d46d2b22.txt (공개 열쇠라 비밀 아님, 지우지 말 것)
name: IndexNow
on:
  push:
    branches: [main]
    paths: ['blog/**']
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: 바뀐 글 주소 모으기 (태그·카테고리 목록은 빼고)
        run: |
          git diff --name-only HEAD~1 HEAD -- 'blog/' | grep 'index.html$' | grep -v '/t/' | grep -v '/c/' \
            | sed 's#index.html$##; s#^#https://tjddlf0224-sudo.github.io/#' > urls.txt || true
          cat urls.txt
      - name: GitHub Pages 반영 기다리기
        run: sleep 150
      - name: 네이버·IndexNow·빙에 알리기
        run: |
          [ -s urls.txt ] || { echo "알릴 주소 없음"; exit 0; }
          python3 -c "import json;print(json.dumps({'host':'tjddlf0224-sudo.github.io','key':'8fb884de5309075b854d7495d46d2b22','keyLocation':'https://tjddlf0224-sudo.github.io/8fb884de5309075b854d7495d46d2b22.txt','urlList':open('urls.txt').read().split()}))" > body.json
          for EP in https://searchadvisor.naver.com/indexnow https://api.indexnow.org/indexnow https://www.bing.com/indexnow; do
            echo "$EP -> $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json; charset=utf-8' --data @body.json $EP)"
          done
