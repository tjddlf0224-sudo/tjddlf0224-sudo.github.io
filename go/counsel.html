<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>학생 상담일지 받기</title><meta property="og:title" content="학생 상담일지 — 무료 앱 받기"><meta property="og:description" content="App Store · Google Play에서 학생 상담일지">
<meta name="robots" content="noindex"></head><body style="font-family:sans-serif;padding:32px;line-height:1.7">
<p><b>학생 상담일지</b> 앱으로 이동합니다…</p>
<p><a id="i" href="#">App Store에서 받기</a><br><a id="a" href="#">Google Play에서 받기</a></p>
<script>
// 스레드 등 홍보 글용 짧은 주소(2026-11-19 홍보팀). ?c=캠페인(영문·숫자·_ 30자) 기본 threads_post. 아이폰→App Store, 안드로이드→Play, 그 밖은 두 링크 보여 줌.
var c=(location.search.match(/[?&]c=([A-Za-z0-9_]{1,30})/)||[])[1]||'threads_post';
var src=c.split('_')[0]; var med=c.split('_').slice(1).join('_')||'post';
var ios='https://apps.apple.com/kr/app/apple-store/id6774818041?pt=128946368&ct='+c+'&mt=8';
var and='https://play.google.com/store/apps/details?id=com.tjddlf0224.counselapp&hl=ko&referrer='+encodeURIComponent('utm_source='+src+'&utm_medium='+med+'&utm_campaign='+c);
document.getElementById('i').href=ios; document.getElementById('a').href=and;
var u=navigator.userAgent; if(/iPhone|iPad|iPod|Macintosh.*Mobile/.test(u)) location.replace(ios); else if(/Android/.test(u)) location.replace(and);
</script></body></html>
