<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>보카바리스타 받기 · Google Play</title>
<!-- 인스타그램 프로필 'Google Play (갤럭시)' 링크용(2026-11-13): 갤럭시 인스타그램 앱 안 브라우저가 play.google.com 을 Play 스토어 앱으로
     넘기지 못하는 일이 있어(사용자 제보), 안드로이드는 intent://(Play 스토어 앱 직접 열기)로 열고 안 되면 일반 Play 주소로. 아이폰은 App Store 로.
     캠페인: Android utm_campaign=insta_bio / iOS ct=insta_bio (~/홍보팀/캠페인_링크.md) -->
<style>
  :root { --bg:#f5f7fa; --card:#ffffff; --txt:#16202c; --dim:#5b6878; --brand:#3b2418; --accent:#e08a4c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1118; --card:#141d28; --txt:#e8eef5; --dim:#9aa8b8; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
         background:var(--bg); color:var(--txt); font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  .card { width:100%; max-width:380px; background:var(--card); border-radius:18px; padding:28px 22px; text-align:center;
          box-shadow:0 8px 28px rgba(0,0,0,.10); border-top:6px solid var(--accent); }
  h1 { margin:0 0 6px; font-size:1.35rem; text-wrap:balance; }
  p { margin:0 0 22px; color:var(--dim); font-size:.95rem; }
  a.btn { display:block; margin:10px 0; padding:14px 16px; border-radius:12px; text-decoration:none; font-weight:700;
          background:var(--brand); color:#fff; }
  a.btn:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .note { margin-top:16px; font-size:.8rem; color:var(--dim); }
</style>
</head>
<body>
<div class="card">
  <h1>보카바리스타</h1>
  <p>Google Play에서 받기</p>
  <a class="btn" id="play" href="https://play.google.com/store/apps/details?id=com.yunsis.vocabbarista&referrer=utm_source%3Dinstagram%26utm_medium%3Dbio%26utm_campaign%3Dinsta_bio">Google Play에서 열기</a>
  <a class="btn" id="ios" href="https://apps.apple.com/kr/app/apple-store/id6788029120?pt=128946368&ct=insta_bio&mt=8" style="background:#555">아이폰은 App Store</a>
  <div class="note" id="note">잠시 뒤 스토어로 이동합니다 · 안 열리면 위 단추를 눌러 주세요</div>
</div>
<script>
(function () {
  var ua = navigator.userAgent || '';
  var iOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  var web = document.getElementById('play').href;
  // 누른 횟수 집계(2026-11-13 성일님 승인): 날짜·앱·기기종류만, 개인정보 없음 → Supabase link_clicks(insert 전용)
  try {
    fetch('https://pjagaulfivafamhhiveg.supabase.co/rest/v1/link_clicks', { method:'POST', keepalive:true,
      headers:{ 'apikey':'sb_publishable_yck2tAKApEjVSJOJMVSXuQ_AGaNatuI', 'Authorization':'Bearer sb_publishable_yck2tAKApEjVSJOJMVSXuQ_AGaNatuI', 'Content-Type':'application/json', 'Prefer':'return=minimal' },
      body: JSON.stringify({ app:'vocab', platform: android ? 'android' : (iOS ? 'ios' : 'other'), campaign:'insta_bio' }) }).catch(function(){});
  } catch (e) {}
  if (android) {
    var intent = 'intent://details?id=com.yunsis.vocabbarista&referrer=utm_source%3Dinstagram%26utm_medium%3Dbio%26utm_campaign%3Dinsta_bio#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
    document.getElementById('play').href = intent;          // 단추도 Play 스토어 앱을 직접 열게(사용자가 누르면 인앱 브라우저도 대개 넘겨 줌)
    location.href = intent;
    setTimeout(function () { if (!document.hidden) location.href = web; }, 1800);   // 스토어 앱으로 안 넘어갔으면 일반 주소로
  } else if (iOS) {
    location.replace(document.getElementById('ios').href);
  } else {
    document.getElementById('note').textContent = '휴대폰에서 열면 바로 스토어로 이동합니다';
  }
})();
</script>
</body>
</html>
