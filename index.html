<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>윤성일 선생님의 웹 프로젝트</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7418287954060066" crossorigin="anonymous"></script>
<style>
  :root{ --bg:#020810; --card:#0c1626; --line:rgba(255,255,255,.08); --blue:#00f2ff; --txt:#eaf2ff; --dim:rgba(234,242,255,.55); }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{ max-width:420px; width:100%; text-align:center; }
  h1{ font-size:1.3rem; margin:0 0 8px; }
  p{ color:var(--dim); font-size:.9rem; margin:0 0 28px; line-height:1.6; }
  a.card{
    display:block; background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:20px; text-decoration:none; color:var(--txt); transition:.15s;
  }
  a.card:active{ transform:scale(.98); }
  .card .icon{ font-size:2rem; margin-bottom:8px; }
  .card .name{ font-weight:700; font-size:1.05rem; margin-bottom:4px; }
  .card .desc{ font-size:.82rem; color:var(--dim); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>윤성일 선생님의 웹 프로젝트</h1>
    <p>아래 프로젝트로 이동하세요.</p>
    <a class="card" href="/account-game-level2-mobile/">
      <div class="icon">🎮</div>
      <div class="name">전산회계 오락실</div>
      <div class="desc">전산회계 2급·1급 게임형 학습 플랫폼</div>
    </a>
  </div>
</body>
</html>
